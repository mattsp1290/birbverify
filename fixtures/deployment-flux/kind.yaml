kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: PROOF_CONFIG
    containerPath: /etc/birbverify
    readOnly: true
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        admission-control-config-file: /etc/birbverify/admission.yaml
        audit-policy-file: /etc/birbverify/audit-policy.yaml
        audit-webhook-config-file: /etc/birbverify/audit.kubeconfig
        audit-webhook-version: audit.k8s.io/v1
        audit-webhook-mode: blocking
      extraVolumes:
      - name: proof-config
        hostPath: /etc/birbverify
        mountPath: /etc/birbverify
        readOnly: true
        pathType: Directory
