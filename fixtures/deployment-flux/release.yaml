apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: local-charts
  namespace: proof-control
spec:
  interval: 1m
  url: http://charts.proof-control.svc.cluster.local
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fence-proof
  namespace: proof-control
spec:
  interval: 1m
  releaseName: fence-proof
  targetNamespace: proof-target
  storageNamespace: proof-target
  values:
    storageProbe: finite-storage-fixture
  kubeConfig:
    secretRef:
      name: release-client
  chart:
    spec:
      chart: fence-proof
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: local-charts
